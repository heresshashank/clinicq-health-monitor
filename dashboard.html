<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Monitor - ClinicQ</title>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e17; font-family: 'Inter', sans-serif; color: #e0e0e0; }
        
        header {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            padding: 1rem 2rem;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 136, 0.15);
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: #fff; }
        .logo-highlight { color: #00ff88; }
        
        .dashboard-container { max-width: 1100px; margin: 2rem auto; padding: 0 20px; }
        
        .vitals-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; 
        }
        .vital-card { 
            background: linear-gradient(145deg, #131920, #1a2332);
            padding: 24px; border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .vital-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }
        .vital-value { font-size: 2.8rem; font-weight: 700; color: #ffffff; }
        .vital-value .unit { font-size: 1rem; color: #7f8c8d; font-weight: 400; }
        .vital-label { color: #8892a4; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 2px; margin-bottom: 8px; }
        
        .vital-card:nth-child(1) .vital-value { color: #ff4d6a; }
        .vital-card:nth-child(2) .vital-value { color: #4da6ff; }
        .vital-card:nth-child(3) .vital-value { color: #ffb84d; }
        
        .ecg-container { 
            background: linear-gradient(145deg, #131920, #1a2332);
            padding: 24px; border-radius: 16px; 
            border: 1px solid rgba(0, 255, 136, 0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .ecg-container h3 {
            color: #00ff88; font-size: 0.85rem; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 16px; font-weight: 600;
        }
        
        .status-dot {
            display: inline-block; width: 8px; height: 8px; 
            background: #00ff88; border-radius: 50%; margin-right: 8px;
            animation: pulse-dot 1.5s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 4px #00ff88; }
            50% { opacity: 0.4; box-shadow: 0 0 8px #00ff88; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">Clinic<span class="logo-highlight">Q</span> Live Monitor</h1>
    </header>

    <div class="dashboard-container">
        <div class="vitals-grid">
            <div class="vital-card">
                <div class="vital-label">Heart Rate</div>
                <div class="vital-value"><span id="bpm">--</span> <span class="unit">BPM</span></div>
            </div>
            <div class="vital-card">
                <div class="vital-label">Oxygen (SpO2)</div>
                <div class="vital-value"><span id="spo2">--</span> <span class="unit">%</span></div>
            </div>
            <div class="vital-card">
                <div class="vital-label">Temperature</div>
                <div class="vital-value"><span id="temp">--</span> <span class="unit">°C</span></div>
            </div>
        </div>

        <div class="ecg-container">
            <h3><span class="status-dot"></span> Live ECG Stream</h3>
            <canvas id="ecgChart" height="80"></canvas>
        </div>
    </div>

    <script>
        const socket = io();
        
        // --- 1. Setup Chart.js ---
        const ctx = document.getElementById('ecgChart').getContext('2d');
        const DATA_POINTS = 200; // More points = more beats visible
        const ecgChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(DATA_POINTS).fill(''),
                datasets: [{
                    label: 'ECG Signal',
                    borderColor: '#00ff88',
                    borderWidth: 1.5,
                    data: Array(DATA_POINTS).fill(0),
                    tension: 0.1,    // Low tension = sharp peaks
                    pointRadius: 0,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        min: -60, max: 150,
                        display: false
                    },
                    x: { display: false }
                }
            }
        });

        // --- 2. Listen for Data ---
        
        // Update Numbers (BPM, SpO2)
        socket.on('vitals_update', (data) => {
            document.getElementById('bpm').innerText = data.bpm;
            document.getElementById('spo2').innerText = data.spo2;
            document.getElementById('temp').innerText = data.temp;
        });

        // Update Graph (ECG) - listen on 'sensor_data' and extract ecg value
        socket.on('sensor_data', (data) => {
            if (data.ecg !== undefined) {
                ecgChart.data.datasets[0].data.shift();
                ecgChart.data.datasets[0].data.push(data.ecg);
                ecgChart.update();
            }
        });
    </script>
</body>
</html>
