<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Monitor — ClinicQ</title>
    <meta name="description" content="Simple real-time patient monitoring dashboard by ClinicQ.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Socket.io & Chart.js -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #2a9d8f;
            --primary-light: #6ec6b8;
            --primary-dark: #1f7a6e;
            --accent: #e76f51;
            --accent-light: #f4a261;
            --danger: #e63946;
            --bg-body: #f7f5f2;
            --bg-card: #ffffff;
            --bg-card-alt: #faf9f7;
            --bg-inset: #f0eeeb;
            --border: #e8e4df;
            --border-light: #f0eeeb;
            --text-900: #1d1d1f;
            --text-700: #3a3a3c;
            --text-500: #6e6e73;
            --text-400: #8e8e93;
            --text-300: #aeaeb2;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.04);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            color: var(--text-700);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 15% 10%, rgba(42, 157, 143, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 80%, rgba(244, 162, 97, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border-light);
            padding: 1rem 2rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(42, 157, 143, 0.3);
        }

        .logo-icon svg {
            width: 20px;
            height: 20px;
        }

        .logo {
            font-size: 1.375rem;
            font-weight: 700;
            color: var(--text-900);
            letter-spacing: -0.02em;
        }

        .logo span {
            color: var(--primary);
        }

        .logo-sub {
            font-size: 0.6875rem;
            color: var(--text-400);
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.15);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.15);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(42, 157, 143, 0.05);
            }
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.25rem;
            position: relative;
            z-index: 1;
        }

        .vitals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .vital-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .vital-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
        }

        .vital-card:nth-child(1)::before {
            background: linear-gradient(90deg, #e63946, #e76f51);
        }

        .vital-card:nth-child(2)::before {
            background: linear-gradient(90deg, #457b9d, #2a9d8f);
        }

        .vital-card:nth-child(3)::before {
            background: linear-gradient(90deg, #f4a261, #e9c46a);
        }

        .vital-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .vital-icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.75rem;
        }

        .vital-icon-wrap svg {
            width: 22px;
            height: 22px;
        }

        .vital-card:nth-child(1) .vital-icon-wrap {
            background: rgba(230, 57, 70, 0.1);
            color: #e63946;
        }

        .vital-card:nth-child(2) .vital-icon-wrap {
            background: rgba(69, 123, 157, 0.1);
            color: #457b9d;
        }

        .vital-card:nth-child(3) .vital-icon-wrap {
            background: rgba(244, 162, 97, 0.1);
            color: #e76f51;
        }

        .vital-label {
            color: var(--text-400);
            text-transform: uppercase;
            font-size: 0.6875rem;
            letter-spacing: 0.1em;
            font-weight: 600;
            margin-bottom: 0.375rem;
        }

        .vital-value {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .vital-card:nth-child(1) .vital-value {
            color: #e63946;
        }

        .vital-card:nth-child(2) .vital-value {
            color: #457b9d;
        }

        .vital-card:nth-child(3) .vital-value {
            color: #e76f51;
        }

        .vital-value .unit {
            font-size: 0.875rem;
            color: var(--text-400);
            font-weight: 500;
            margin-left: 0.125rem;
        }

        .ecg-container {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.3s ease;
        }

        .ecg-container:hover {
            box-shadow: var(--shadow-md);
        }

        .ecg-container h3 {
            color: var(--primary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }

        .ecg-chart-wrap {
            background: var(--bg-card-alt);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .ecg-chart-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(42, 157, 143, 0.04) 1px, transparent 1px),
                linear-gradient(rgba(42, 157, 143, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vital-card {
            animation: slideUp 0.5s ease both;
        }

        .vital-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .vital-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .vital-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .ecg-container {
            animation: slideUp 0.5s 0.4s ease both;
        }

        @media (max-width: 768px) {
            .vitals-grid {
                grid-template-columns: 1fr;
            }

            .vital-value {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                </svg>
            </div>
            <div>
                <div class="logo">Clinic<span>Q</span></div>
                <div class="logo-sub">Live Monitor</div>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="vitals-grid">
            <div class="vital-card">
                <div class="vital-icon-wrap"><i data-lucide="heart"></i></div>
                <div class="vital-label">Heart Rate</div>
                <div class="vital-value"><span id="bpm">--</span> <span class="unit">BPM</span></div>
            </div>
            <div class="vital-card">
                <div class="vital-icon-wrap"><i data-lucide="droplets"></i></div>
                <div class="vital-label">Oxygen (SpO2)</div>
                <div class="vital-value"><span id="spo2">--</span> <span class="unit">%</span></div>
            </div>
            <div class="vital-card">
                <div class="vital-icon-wrap"><i data-lucide="thermometer"></i></div>
                <div class="vital-label">Temperature</div>
                <div class="vital-value"><span id="temp">--</span> <span class="unit">°C</span></div>
            </div>
        </div>

        <div class="ecg-container">
            <h3><span class="status-dot"></span> Live ECG Stream</h3>
            <div class="ecg-chart-wrap">
                <canvas id="ecgChart" height="80"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        const socket = io();

        const ctx = document.getElementById('ecgChart').getContext('2d');
        const DATA_POINTS = 200;
        const ecgChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(DATA_POINTS).fill(''),
                datasets: [{
                    label: 'ECG Signal',
                    borderColor: '#2a9d8f',
                    borderWidth: 1.8,
                    data: Array(DATA_POINTS).fill(0),
                    tension: 0.1,
                    pointRadius: 0,
                    fill: {
                        target: 'origin',
                        above: 'rgba(42, 157, 143, 0.04)',
                        below: 'rgba(42, 157, 143, 0.02)'
                    }
                }]
            },
            options: {
                responsive: true,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        min: -60, max: 150,
                        display: false
                    },
                    x: { display: false }
                }
            }
        });

        socket.on('vitals_update', (data) => {
            document.getElementById('bpm').innerText = data.bpm;
            document.getElementById('spo2').innerText = data.spo2;
            document.getElementById('temp').innerText = data.temp;
        });

        socket.on('sensor_data', (data) => {
            if (data.ecg !== undefined) {
                ecgChart.data.datasets[0].data.shift();
                ecgChart.data.datasets[0].data.push(data.ecg);
                ecgChart.update();
            }
        });
    </script>
</body>

</html>
