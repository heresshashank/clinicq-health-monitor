<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Monitor — ClinicQ</title>
    <meta name="description" content="Simple real-time patient monitoring dashboard by ClinicQ.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Socket.io & Chart.js -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #0084ff;
            --primary-shadow: rgba(0, 132, 255, 0.25);
            --heart-red: #ef4444;
            --oxy-blue: #3b82f6;
            --temp-amber: #f59e0b;
            --bg-body-start: #f0f4fb;
            --bg-body-mid: #f5f3f0;
            --bg-body-end: #faf8f6;
            --bg-card: #ffffff;
            --bg-card-alt: #fcfaf8;
            --bg-inset: #f3f1ee;
            --border-light: #edf2f9;
            --text-900: #0f172a;
            --text-700: #334155;
            --text-500: #64748b;
            --text-400: #94a3b8;
            --text-300: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(0, 50, 100, 0.04), 0 1px 2px rgba(0, 50, 100, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 50, 100, 0.06), 0 2px 4px rgba(0, 50, 100, 0.04);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(170deg, var(--bg-body-start) 0%, var(--bg-body-mid) 45%, var(--bg-body-end) 100%);
            min-height: 100vh;
            color: var(--text-700);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 15% 0%, rgba(0, 132, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 85%, rgba(59, 130, 246, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 30%, rgba(245, 190, 80, 0.04) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.75rem 1.5rem 0;
        }

        .header-bar {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid var(--border-light);
            border-radius: 60px;
            padding: 0.625rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.625rem;
            box-shadow: 0 2px 20px rgba(0, 50, 100, 0.06);
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: var(--primary);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 3px 10px var(--primary-shadow);
        }

        .logo {
            font-size: 1.1875rem;
            font-weight: 700;
            color: var(--text-900);
        }

        .logo span {
            color: var(--primary);
        }

        .logo-sub {
            font-size: 0.625rem;
            color: var(--text-400);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 0 3px rgba(0, 132, 255, 0.15);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                box-shadow: 0 0 0 3px rgba(0, 132, 255, 0.15);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(0, 132, 255, 0.05);
            }
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.25rem;
            position: relative;
            z-index: 1;
        }

        .vitals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .vital-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .vital-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: rgba(0, 132, 255, 0.15);
        }

        .vital-icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.75rem;
        }

        .vital-icon-wrap svg {
            width: 22px;
            height: 22px;
        }

        .vital-card:nth-child(1) .vital-icon-wrap {
            background: rgba(239, 68, 68, 0.08);
            color: #ef4444;
        }

        .vital-card:nth-child(2) .vital-icon-wrap {
            background: rgba(59, 130, 246, 0.08);
            color: #3b82f6;
        }

        .vital-card:nth-child(3) .vital-icon-wrap {
            background: rgba(245, 158, 11, 0.08);
            color: #f59e0b;
        }

        .vital-label {
            color: var(--text-400);
            text-transform: uppercase;
            font-size: 0.625rem;
            letter-spacing: 0.1em;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .vital-value {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .vital-card:nth-child(1) .vital-value {
            color: #ef4444;
        }

        .vital-card:nth-child(2) .vital-value {
            color: #3b82f6;
        }

        .vital-card:nth-child(3) .vital-value {
            color: #f59e0b;
        }

        .vital-value .unit {
            font-size: 0.8125rem;
            color: var(--text-400);
            font-weight: 500;
        }

        .ecg-container {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.3s ease;
        }

        .ecg-container:hover {
            box-shadow: var(--shadow-md);
        }

        .ecg-container h3 {
            color: var(--primary);
            font-size: 0.6875rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }

        .ecg-chart-wrap {
            background: var(--bg-card-alt);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .ecg-chart-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(0, 132, 255, 0.04) 1px, transparent 1px),
                linear-gradient(rgba(0, 132, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .vital-card {
            animation: fadeSlideUp 0.5s ease both;
        }

        .vital-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .vital-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .vital-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .ecg-container {
            animation: fadeSlideUp 0.5s 0.4s ease both;
        }

        @media (max-width: 768px) {
            .vitals-grid {
                grid-template-columns: 1fr;
            }

            .vital-value {
                font-size: 2rem;
            }

            .header-bar {
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-bar">
            <div class="logo-icon">C</div>
            <div>
                <div class="logo">Clinic<span>Q</span></div>
                <div class="logo-sub">Live Monitor</div>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="vitals-grid">
            <div class="vital-card">
                <div class="vital-icon-wrap"><i data-lucide="heart"></i></div>
                <div class="vital-label">Heart Rate</div>
                <div class="vital-value"><span id="bpm">--</span> <span class="unit">BPM</span></div>
            </div>
            <div class="vital-card">
                <div class="vital-icon-wrap"><i data-lucide="droplets"></i></div>
                <div class="vital-label">Oxygen (SpO2)</div>
                <div class="vital-value"><span id="spo2">--</span> <span class="unit">%</span></div>
            </div>
            <div class="vital-card">
                <div class="vital-icon-wrap"><i data-lucide="thermometer"></i></div>
                <div class="vital-label">Temperature</div>
                <div class="vital-value"><span id="temp">--</span> <span class="unit">°C</span></div>
            </div>
        </div>

        <div class="ecg-container">
            <h3><span class="status-dot"></span> Live ECG Stream</h3>
            <div class="ecg-chart-wrap">
                <canvas id="ecgChart" height="80"></canvas>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const socket = io();
        const ctx = document.getElementById('ecgChart').getContext('2d');
        const DATA_POINTS = 200;

        const ecgChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(DATA_POINTS).fill(''),
                datasets: [{
                    label: 'ECG Signal',
                    borderColor: '#0084ff',
                    borderWidth: 1.8,
                    data: Array(DATA_POINTS).fill(0),
                    tension: 0.1,
                    pointRadius: 0,
                    fill: {
                        target: 'origin',
                        above: 'rgba(0, 132, 255, 0.04)',
                        below: 'rgba(0, 132, 255, 0.02)'
                    }
                }]
            },
            options: {
                responsive: true,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { min: -60, max: 150, display: false },
                    x: { display: false }
                }
            }
        });

        socket.on('vitals_update', (data) => {
            document.getElementById('bpm').innerText = data.bpm;
            document.getElementById('spo2').innerText = data.spo2;
            document.getElementById('temp').innerText = data.temp;
        });

        socket.on('sensor_data', (data) => {
            if (data.ecg !== undefined) {
                ecgChart.data.datasets[0].data.shift();
                ecgChart.data.datasets[0].data.push(data.ecg);
                ecgChart.update();
            }
        });
    </script>
</body>

</html>
